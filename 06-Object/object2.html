<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objects are references</title>
</head>
<body>
  <script>
    const object1 = {
      message: 'hello'
    }
    const object2 = object1;

    object1.message = 'Good job'
    console.log(object1);
    console.log(object2);

    const object3 = {
      message: 'Good Job!'
    }
    console.log(object3 === object1);


    const object4 = {
      message: 'Good Job!',
      price: 799
    };
    //const message = object4.message;

    const { message, price } = object4;
    console.log(message);
    console.log(price);

    const object5 = {
     // message: message
      message,
     // method: function function1() {
     //   console.log('method');
     // }
      method() {
        console.log('method');
      }
    }
    console.log(object5);
    object5.method();
  </script>
</body>
</html>
