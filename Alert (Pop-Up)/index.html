<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Alert</title>
</head>
<body>
  <style>
    .red-button {
      background-color: red;
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
    }

    .yellow-button {
      background-color: yellow;
      color: black;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
    }
  </style>
  <button title="Good Job!" class="red-button" onclick="
    alert('Good job!');">Hello</button>

  <p>
    paragraph of <button class="yellow-button">hello</button>
  </p>

  <script>alert('hello');

  </script>
</body>
</html>
