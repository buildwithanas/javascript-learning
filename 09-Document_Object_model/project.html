<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Project</title>
</head>
  <p>YouTube Subscribe Button</p>

  <button onclick="
    subscribe();
  " class="js-subscribe-button">Subscribe</button>
  
  <p>Rock Paper Scissors</p>

  <a href="09-rps.html">Click here</a>

  <p>Amazon Shipping Calculator</p>

  <p>Orders under $40 = +$10 shipping.</p>

  <p>Orders over $40 = FREE shipping.</p>

  <input type="text" placeholder="cost of order" class="js-cost-input">
  <button onclick="
  calculateTotal();
  ">Calculate</button>
  <p class="js-total-cost"></p>


  <script>

    function calculateTotal() {
      const inputElement = document.querySelector('.js-cost-input');
      let cost= inputElement.value;
      console.log(cost);

      if (cost < 40) {
        cost = cost + 10;
      }

      document.querySelector('.js-total-cost')
        .innerHTML = `$${cost}`;
    }

    function subscribe() {
      const buttonElement = document.querySelector('.js-subscribe-button');

      if(buttonElement.innerText === 'Subscribe') {
        buttonElement.innerHTML = 'Subsribed';
      } else {
        buttonElement.innerHTML = 'Subscribe';
      }
    }
  </script>
  
</body>
</html>
