<!DOCTYPE html>
<!-- saved from url=(0053)https://supersimple.dev/projects/rock-paper-scissors/ -->
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Rock Paper Scissors</title>
    <style>
      body {
        background-color: rgb(25, 25, 25);
        color: white;
        font-family: Arial;
      }

      .title {
        font-size: 30px;
        font-weight: bold;
      }

      .move-icon {
        height: 50px;
      }

      .move-button {
        width: 120px;
        height: 120px;
        border-radius: 60px;
        border: 3px solid white;

        background-color: transparent;
        margin-right: 10px;
        cursor: pointer;
      }

      .result {
        font-size: 25px;
        font-weight: bold;
        margin-top: 50px;
      }

      .score {
        margin-top: 60px;
      }

      .reset-score-button {
        background-color: white;
        border: none;
        font-size: 15px;
        padding: 8px 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>

    <button onclick="
      makeMove(&#39;rock&#39;);
    " class="move-button">
      <img class="move-icon" src="./Rock Paper Scissors_files/rock-emoji.png">
    </button>

    <button onclick="
      makeMove(&#39;paper&#39;);
    " class="move-button">
      <img class="move-icon" src="./Rock Paper Scissors_files/paper-emoji.png">
    </button>

    <button onclick="
      makeMove(&#39;scissors&#39;);
    " class="move-button">
      <img class="move-icon" src="./Rock Paper Scissors_files/scissors-emoji.png">
    </button>

    <p class="result js-result">You win.</p>
    <p class="js-moves-chosen">
          You
          <img src="./Rock Paper Scissors_files/paper-emoji.png" class="move-icon">
          <img src="./Rock Paper Scissors_files/rock-emoji.png" class="move-icon">
          Computer
        </p>

    <p class="score js-score">
          Wins: 1, Losses: 0, Ties: 0
        </p>
    <button class="reset-score-button" onclick="
      resetScore();
    ">
      Reset Score
    </button>

    <script></script>
  

</body></html>
