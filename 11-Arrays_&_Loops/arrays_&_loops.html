<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MORE Arrays & LOOPS</title>
</head>
<body>
  <script>
    // ARRAYS ARE REFERENCES
    const array1 = [1, 2, 3];
    const array2 = array1.slice();
    array2.push(4);
    console.log(array1);
    console.log(array2);

    const [firstValue, secondValue] = [1, 2, 3];


    for (let i = 1; 1 <= 10; i++) {
      if (i === 3) {
        continue;      }
      console.log(i);
      if (i === 8){
        break;
      }
    }

    for (let i = 1; 1 <= 10; i++) {
      if (i % 3 === 0) {
        continue;      
      }
      console.log(i);
      if (i === 8){
        break;
      }
    }

    let i = 1;
    while(1 <= 10) {
      if (i % 3 === 0) {
        i++;
        continue;
      }
      console.log(i);
      i++
    }
    

    function doubleArray(nums) {
      const numsDoubled = [];

      for (let i = 0; i < nums.length; i++) {
        const num = nums[i];
        if (num === 0) {
          return numsDoubled;
        }
        numsDoubled.push(num * 2);
      }
      return numsDoubled;
    }
    console.log(doubleArray([1, 1, 3]));
    console.log(doubleArray([2, 2, 5]));
    console.log(doubleArray([2, 0, 5]));
    
    </script>
</body>
</html>
