<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loops</title>
</head>
<body>
  
  <script>
    let i = 1;
    while (i <= 10) {
      console.log(i);
      i++;
   // i += 1
   // i = i + 1
    }


    // FOR LOOP
    for (let i = 1; i <= 8; i++) {
      console.log(i);
    }
  </script>
</body>
</html>
