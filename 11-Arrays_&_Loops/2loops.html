<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Looping Through An Array</title>
</head>
<body>
  
  <script>
    const todoList = [
      'make dinner',
      'code on vs',
      'watch youtube',
    ];

    for (let index = 0; index <= todoList.length -1; index++) {
      console.log(index)
    }
  </script>
</body>
</html>
