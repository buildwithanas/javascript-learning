<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
</head>
<body>
  <p>Rock Paper Scissors</p>

  <button onclick="
    const playerMove = 'rock';
    pickComputerMove();

    let result = '';

    if (computerMove === 'scissors') {
      result = 'You lose.';
    } else if (computerMove === 'rock') {
      result = 'You win.';
    } else if (computerMove === 'paper') {
      result = 'Tie';
    }

    alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}`);
  ">Rock</button>
  
  <button onclick="
    const playerMove = 'paper';
    pickComputerMove();

    let result = '';

    if (computerMove === 'rock') {
      result = 'Tie.';
    } else if (computerMove === 'paper') {
      result = 'You lose.';
    } else if (computerMove === 'scissors') {
      result = 'You win.';
    }

    alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}`);
  ">Paper</button>
  
  <button onclick="
    const playerMove = 'scissors';
    pickComputerMove();

    let result = '';

    if (computerMove === 'scissors') {
      result = 'Tie.';
    } else if (computerMove === 'rock') {
      result = 'You lose.';
    } else if (computerMove === 'paper') {
      result = 'You win.';
    }

    alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}`);
  ">Scissors</button>

  <p><a href="#">Click here</a> to see the final version of the project.</p>

  <script>
    let computerMove = '';

    function pickComputerMove() {
      const randomNumber = Math.random();

      if (randomNumber >= 0 && randomNumber < 1 / 3) {
        computerMove = 'rock';
      } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
        computerMove = 'paper';  // Fixed: was 'rock'
      } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
        computerMove = 'scissors';  // Fixed: was 'paper'
      }
    }
  </script>
</body>
</html>
