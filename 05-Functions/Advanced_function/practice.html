<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advance Functions</title>
</head>
<body>
  <script>

    
    function greeting() {
      console.log('Hello, Anas!');
    }
    greeting();

    const object1 = {
      name: 'Anas',
      age: 17,
      introduce: function() {
        console.log('My name is Anas Amoo');
      }
    }
    object1.introduce();
      

    function runFunction(run) {
      run();
    }
    runFunction(function() {
      console.log('JavaScript is getting easier!')
    });


    //practice 1
    setTimeout(function() {
      console.log('Hello Anas');
    }, 2000);
    console.log('This comes first');

    //practice 2
    setTimeout(function() {
      console.log('I waited');
      console.log('JavaScript is fun');
    }, 5000);
    console.log('Done');


    //practice 3
    setInterval(function() {
      console.log('Learning JavaScript...');
    }, 2000);

    //practice 4
    setTimeout(function() {
      console.log('3 seconds passed');
    }, 3000);

    setInterval(function() {
      console.log('2 seconds passed');
    }, 2000);
    
    
  </script>
</body>
</html>
