<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advance Functions</title>
</head>
<body>
  <script>
    function greeting() {
      console.log('Hello, Anas!');
    }
    greeting();

    const object1 = {
      name: 'Anas',
      age: 17,
      introduce: function() {
        console.log('My name is Anas Amoo');
      }
    }
    object1.introduce();
      

    function runFunction(run) {
      run();
    }
    runFunction(function() {
      console.log('JavaScript is getting easier!')
    });

  </script>
</body>
</html>
