<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>If Statement</title>
</head>
<body>

  
  <script>
    // IF STATEMENTS LET US WRITE GROUPS OF CODE AND THEN DECIDE WHICH CODE TO RUN

    if (false) {
      console.log('hello');
    } else {
      console.log('else');
    }
  </script>
  
</body>
</html>
