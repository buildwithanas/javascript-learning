<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
</head>
<body>
  <p>Rock Paper Scissors</p>

  <button onclick="playGame('rock')">Rock</button>
  <button onclick="playGame('paper')">Paper</button>
  <button onclick="playGame('scissors')">Scissors</button>

  <p><a href="#">Click here</a> to see the final version of the project.</p>

  <script>
    function playGame(playerMove) {
      // 1. Generate computer move
      const randomNumber = Math.random();
      let computerMove = '';

      if (randomNumber < 1 / 3) {
        computerMove = 'rock';
      } else if (randomNumber < 2 / 3) {
        computerMove = 'paper';      // Bug 1 fixed: lowercase
      } else {
        computerMove = 'scissors';
      }

      // 2. Determine result based on PLAYER's move  (Bug 2 fixed)
      let result = '';

      if (playerMove === computerMove) {
        result = 'Tie.';
      } else if (
        (playerMove === 'rock'     && computerMove === 'scissors') ||
        (playerMove === 'paper'    && computerMove === 'rock')     ||
        (playerMove === 'scissors' && computerMove === 'paper')
      ) {
        result = 'You win.';
      } else {
        result = 'You lose.';
      }

      // 3. Show correct moves in alert  (Bug 3 fixed)
      alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}`);
    }
  </script>
</body>
</html>
