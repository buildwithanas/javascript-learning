<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Variables Exercises</title>
</head>
<body>
  
  <script>
    let name = 'Anas';
    console.log(`My name is ${name}`);

    let cost = 5 + (3 * 2) + 9;
    console.log(cost);
    console.log(`Cost of food: ${cost}`);

    let tax = (5 + (3 * 2) + 9) * 0.1;
    console.log(tax);
    console.log(`Tax (10%): $${tax}`);

    let totalCost = (5 + (3 * 2) + 9) + 2;
    console.log(`Total cost: $${totalCost}`);

    let totalCost2 = (cost + tax);
    console.log(`Total cost: $${totalCost2}`);

    
  </script>
</body>
</html>
