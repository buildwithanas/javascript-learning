<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <button onclick="
      task();
    " class="js-button">Test</button>

  <script>
    function task() {
      const buttonElement = document.querySelector('.js-button');

      if(buttonElement.innerText === 'Test') {
        buttonElement.innerHTML === 'Done';
        classList.contains.add('Is Done');
      } else {
        buttonElement.innerHTML === 'Test';

      }
      console.log('task')
    }
  </script>

</body>
</html>
